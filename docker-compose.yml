services:
  postgres:
    image: postgres:16-alpine
    profiles: ["core", "full"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: paiflow
      POSTGRES_PASSWORD: paiflow
      POSTGRES_DB: paiflow
    ports:
      - "5432:5432"
    volumes:
      - paiflow_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paiflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    profiles: ["core", "full"]
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - paiflow_redis:/data

  minio:
    image: minio/minio:latest
    profiles: ["full"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: paiflow
      MINIO_ROOT_PASSWORD: paiflow-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - paiflow_minio:/data

volumes:
  paiflow_pg:
  paiflow_redis:
  paiflow_minio:
