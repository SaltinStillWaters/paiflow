# Railway configuration. See https://docs.railway.app/reference/config-as-code

[build]
builder = "NIXPACKS"
buildCommand = "pnpm install --frozen-lockfile && pnpm db:generate && pnpm build"

[deploy]
startCommand = "pnpm db:migrate:deploy && pnpm start"
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

[[deploy.cron]]
name = "poll-events"
schedule = "* * * * *"
command = "curl -fsSL -H \"x-cron-secret: $CRON_SECRET\" https://$RAILWAY_PUBLIC_DOMAIN/api/cron/poll-events || true"

[[deploy.cron]]
name = "process-timelock-jobs"
schedule = "* * * * *"
command = "curl -fsSL -H \"x-cron-secret: $CRON_SECRET\" https://$RAILWAY_PUBLIC_DOMAIN/api/cron/process-timelock-jobs || true"

[[deploy.cron]]
name = "process-streamer-jobs"
schedule = "* * * * *"
command = "curl -fsSL -H \"x-cron-secret: $CRON_SECRET\" https://$RAILWAY_PUBLIC_DOMAIN/api/cron/process-streamer-jobs || true"

[[deploy.cron]]
name = "process-deployment-finalize-jobs"
schedule = "* * * * *"
command = "curl -fsSL -H \"x-cron-secret: $CRON_SECRET\" https://$RAILWAY_PUBLIC_DOMAIN/api/cron/process-deployment-finalize-jobs || true"

[[deploy.cron]]
name = "send-emails"
schedule = "* * * * *"
command = "curl -fsSL -H \"x-cron-secret: $CRON_SECRET\" https://$RAILWAY_PUBLIC_DOMAIN/api/cron/send-emails || true"
