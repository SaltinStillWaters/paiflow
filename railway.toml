# Railway configuration. See https://docs.railway.app/reference/config-as-code

[build]
builder = "NIXPACKS"
buildCommand = "pnpm install --frozen-lockfile && pnpm db:generate && pnpm build"

[deploy]
startCommand = "pnpm db:migrate:deploy && pnpm start"
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

[[deploy.cron]]
name = "poll-events"
schedule = "* * * * *"
command = "curl -fsSL -H \"x-cron-secret: $CRON_SECRET\" https://$RAILWAY_PUBLIC_DOMAIN/api/cron/poll-events || true"

[[deploy.cron]]
name = "finalize-deployments"
schedule = "*/2 * * * *"
command = "curl -fsSL -H \"x-cron-secret: $CRON_SECRET\" https://$RAILWAY_PUBLIC_DOMAIN/api/cron/finalize-deployments || true"
