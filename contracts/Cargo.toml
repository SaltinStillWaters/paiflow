[workspace]
resolver = "2"
members = [
  "triggers/deposit_trigger",
  "triggers/webhook",
  "triggers/subscription",
  "triggers/oracle",
  "conditions/conditional",
  "conditions/router",
  "conditions/timelock",
  "conditions/multisig",
  "actions/splitter",
  "actions/streamer",
  "actions/swapper",
  "actions/yield",
  "factory",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/webnxt-2030/pinkraft"

[workspace.dependencies]
soroban-sdk = { version = "26.0.0" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
