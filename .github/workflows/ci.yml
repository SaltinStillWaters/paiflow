name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pinkraft
          POSTGRES_PASSWORD: pinkraft
          POSTGRES_DB: pinkraft
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pinkraft"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://pinkraft:pinkraft@localhost:5432/pinkraft?schema=public
      AUTH_SECRET: ci-secret-not-for-production-32chars-min-padding-aaaaaa
      ADMIN_SEED_PASSWORD: ci-admin-password-12chars
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm db:migrate:deploy
      - run: pnpm db:seed
      - run: pnpm build
      - name: pnpm audit
        run: pnpm audit --prod || true

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.83.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --workspace
